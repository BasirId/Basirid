<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Barang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  DETAIL BARANG
</div>

<div class="container" id="detail"></div>

<script>
async function loadDetail() {
  try {
    const params = new URLSearchParams(window.location.search);
    const kode = params.get("kode");

    const [barangRes, lokasiRes, unitRes] = await Promise.all([
      fetch('barang.json'),
      fetch('lokasi.json'),
      fetch('unit.json')
    ]);

    const barang = await barangRes.json();
    const lokasi = await lokasiRes.json();
    const unit = await unitRes.json();

    const item = barang.find(b => b.kode === kode);
    const lokasiItem = lokasi.find(l => l.kode === kode);
    const unitItem = unit.filter(u => u.kode_barang === kode);

    const container = document.getElementById("detail");

    if (!item) {
      container.innerHTML = "<p>Data tidak ditemukan</p>";
      return;
    }

    container.innerHTML = `
      <div class="card">
        <img src="${item.gambar || 'https://via.placeholder.com/400x200'}">
      </div>

      <div class="card">
        <h2>${item.nama}</h2>
        <ul>
          <li><b>Kode:</b> ${item.kode}</li>
          <li><b>Kategori:</b> ${item.kategori}</li>
          <li><b>Brand:</b> ${item.brand}</li>
          <li><b>Part Number:</b> ${item.part_number}</li>
          <li><b>Status:</b> ${item.status}</li>
        </ul>
      </div>

      <div class="card">
        <h2>Deskripsi</h2>
        <p>${item.deskripsi}</p>
      </div>

      <div class="card">
        <h2>Lokasi</h2>
        <p>${lokasiItem ? lokasiItem.nama_lokasi : 'Belum ada lokasi'}</p>
      </div>

      <div class="card">
        <h2>Unit Terkait</h2>
        ${
          unitItem.length > 0
          ? '<ul>' + unitItem.map(u => `<li>${u.nama_unit}</li>`).join('') + '</ul>'
          : '<p>Tidak ada unit</p>'
        }
      </div>
    `;
  } catch (err) {
    document.getElementById("detail").innerHTML = "<p>Error load data</p>";
    console.error(err);
  }
}

loadDetail();
</script>

</body>
</html>
