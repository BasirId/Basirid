<script>
(async function () {
  const el = document.getElementById("detail");

  try {
    const kode = new URLSearchParams(location.search).get("kode");

    el.innerHTML = "Loading...<br>Kode: " + kode;

    const barang = await fetch("barang.json").then(r => r.json());

    console.log("SEMUA DATA:", barang);

    // tampilkan semua kode biar kelihatan
    let semuaKode = barang.map(x => x.kode).join("<br>");
    
    const item = barang.find(x => String(x.kode).trim() === String(kode).trim());

    if (!item) {
      el.innerHTML = `
        ❌ DATA TIDAK KETEMU<br><br>
        Kode dicari: ${kode}<br><br>
        Semua kode di JSON:<br>${semuaKode}
      `;
      return;
    }

    el.innerHTML = `
      <h2>${item.nama}</h2>
      <p>${item.deskripsi}</p>
    `;

  } catch (e) {
    el.innerHTML = "ERROR: " + e;
    console.error(e);
  }
})();
</script>
