<!DOCTYPE html>
<html>
<head>
  <title>Detail Barang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">Detail Barang</div>

<div class="container" id="detail"></div>

<script src="data.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const kode = urlParams.get("kode");

const item = dataBarang.find(d => d.kode === kode);

const detail = document.getElementById("detail");

if (item) {
  detail.innerHTML = `
    <div class="card">
      <img src="${item.gambar}">
    </div>

    <div class="card">
      <h2>${item.nama}</h2>
      <p>Kode: ${item.kode}</p>
      <p>Part: ${item.part}</p>
      <p>Brand: ${item.brand}</p>
    </div>

    <div class="card">
      <h3>Deskripsi</h3>
      <p>${item.deskripsi}</p>
    </div>

    <div class="card">
      <h3>Kebutuhan</h3>
      <ul>
        ${item.kebutuhan.map(k => `<li>${k}</li>`).join("")}
      </ul>
    </div>
  `;
} else {
  detail.innerHTML = "<h2>Data tidak ditemukan</h2>";
}
</script>

</body>
</html>
