<script>
(async function () {
  const el = document.getElementById("detail");
  const kode = new URLSearchParams(location.search).get("kode");

  try {
    // LOAD BARANG
    const barangRes = await fetch("barang.json");
    const barang = await barangRes.json();

    // LOAD UNIT (AMAN)
    let unit = [];
    try {
      const unitRes = await fetch("unit.json");
      unit = await unitRes.json();
    } catch (e) {
      console.log("unit.json tidak ada, skip...");
    }

    const item = barang.find(x => x.kode === kode);
    const unitItem = unit.filter(u => u.kode_barang === kode);

    if (!item) {
      el.innerHTML = "<p>Data tidak ditemukan</p>";
      return;
    }

    el.innerHTML = `
      <div class="row">
        <div class="field">
          <label>Nama Barang</label>
          <div>${item.nama}</div>
        </div>
        <div class="field">
          <label>Kode</label>
          <div>${item.kode}</div>
        </div>
      </div>

      <div class="field full">
        <label>Part Number</label>
        <div>${item.part_number}</div>
      </div>

      <div class="field full">
        <label>Brand</label>
        <div>${item.brand}</div>
      </div>

      <div class="section">
        <label>Deskripsi</label>
        <p>${item.deskripsi}</p>
      </div>

      <div class="section">
        <label>Unit</label>
        ${
          unitItem.length
          ? '<ul>' + unitItem.map(u => `<li>${u.nama_unit}</li>`).join('') + '</ul>'
          : '<p>-</p>'
        }
      </div>
    `;

  } catch (err) {
    console.error(err);
    el.innerHTML = "<p>Error load data</p>";
  }
})();
</script>
