<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Barang</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

<div class="logo">
📦 Detail Barang
</div>

</header>

<div class="container" id="detail">

</div>

<script src="data.js"></script>

<script>

const urlParams = new URLSearchParams(window.location.search);

const kode = urlParams.get("kode");

const item = dataBarang.find(d => d.kode === kode);

const detail = document.getElementById("detail");

if(item){

const gambar =
item.gambar && item.gambar !== ""
?
item.gambar
:
"images/no-image.png";

detail.innerHTML = `

<div class="detail-card">

<img
class="detail-image"
src="${gambar}"
onerror="this.src='images/no-image.png'">

<div class="detail-content">

<h2>${item.nama}</h2>

<table class="detail-table">

<tr>
<td><b>Kode</b></td>
<td>${item.kode}</td>
</tr>

<tr>
<td><b>Kategori</b></td>
<td>${item.kategori}</td>
</tr>

<tr>
<td><b>Part Number</b></td>
<td>${item.part_number || "-"}</td>
</tr>

<tr>
<td><b>Brand</b></td>
<td>${item.brand || "-"}</td>
</tr>

<tr>
<td><b>Lokasi</b></td>
<td>${item.lokasi || "-"}</td>
</tr>

<tr>
<td><b>Status</b></td>
<td>

<span class="status ${item.status}">
${item.status}
</span>

</td>
</tr>

</table>

<div class="deskripsi">

<h3>Deskripsi</h3>

<p>

${item.deskripsi || "-"}

</p>

</div>

<div class="deskripsi">

<h3>Digunakan Pada Unit</h3>

${
item.unit.length
?

`
<ul>

${item.unit.map(u=>`

<li>${u}</li>

`).join("")}

</ul>

`

:

"<p>Belum ada data unit.</p>"

}

</div>

<br>

<a
href="index.html"
class="btn">

← Kembali

</a>

</div>

</div>

`;

}else{

detail.innerHTML=`

<div class="detail-card">

<div class="detail-content">

<h2>Data Tidak Ditemukan</h2>

<p>

Kode barang tidak tersedia.

</p>

<br>

<a
href="index.html"
class="btn">

← Kembali

</a>

</div>

</div>

`;

}

</script>

</body>
</html>
