<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Barang</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">
        📦 Inventory Barang
    </div>

    <input
        type="text"
        id="searchInput"
        placeholder="Cari Kode, Nama, Part Number atau Brand..."
    >
</header>

<section class="filter-area">

    <select id="filterKategori">
        <option value="">Semua Kategori</option>
    </select>

    <select id="filterLokasi">
        <option value="">Semua Lokasi</option>
    </select>

</section>

<section class="info">

    <span id="jumlahBarang">0 Barang</span>

</section>

<main id="listBarang" class="grid-card">

</main>

<div class="not-found" id="notFound" style="display:none;">
    Tidak ada data ditemukan
</div>

<footer>

    Inventory Barang © 2026

</footer>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
