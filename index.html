<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Warehouse App</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f2f2f2;
}

.header {
  background: #007bff;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.menu {
  display: flex;
  justify-content: space-around;
  background: white;
  padding: 10px;
}

.menu button {
  border: none;
  background: #007bff;
  color: white;
  padding: 10px;
  border-radius: 5px;
}

.box {
  background: white;
  margin: 10px;
  padding: 15px;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
}

li {
  background: #eee;
  margin-top: 5px;
  padding: 10px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
}

.hapus {
  background: red;
  color: white;
  border: none;
}
</style>

</head>

<body>

<div class="header">📦 Warehouse App</div>

<div class="menu">
  <button onclick="show('barang')">Barang</button>
  <button onclick="show('alat')">Alat</button>
</div>

<div id="barang" class="box">
  <h3>Data Barang</h3>
  <input type="text" id="inputBarang" placeholder="Nama barang">
  <button onclick="tambahBarang()">Tambah</button>
  <ul id="listBarang"></ul>
</div>

<div id="alat" class="box" style="display:none">
  <h3>Data Alat</h3>
  <input type="text" id="inputAlat" placeholder="Nama alat">
  <button onclick="tambahAlat()">Tambah</button>
  <ul id="listAlat"></ul>
</div>

<script>
let barang = JSON.parse(localStorage.getItem("barang")) || [];
let alat = JSON.parse(localStorage.getItem("alat")) || [];

function show(menu){
  document.getElementById("barang").style.display = "none";
  document.getElementById("alat").style.display = "none";
  document.getElementById(menu).style.display = "block";
}

function tampil(){
  let lb = document.getElementById("listBarang");
  lb.innerHTML = "";
  barang.forEach((b,i)=>{
    lb.innerHTML += `<li>${b} <button class="hapus" onclick="hapusBarang(${i})">X</button></li>`;
  });

  let la = document.getElementById("listAlat");
  la.innerHTML = "";
  alat.forEach((a,i)=>{
    la.innerHTML += `<li>${a} <button class="hapus" onclick="hapusAlat(${i})">X</button></li>`;
  });
}

function tambahBarang(){
  let val = document.getElementById("inputBarang").value;
  if(val=="") return alert("Isi dulu!");
  barang.push(val);
  localStorage.setItem("barang", JSON.stringify(barang));
  document.getElementById("inputBarang").value="";
  tampil();
}

function tambahAlat(){
  let val = document.getElementById("inputAlat").value;
  if(val=="") return alert("Isi dulu!");
  alat.push(val);
  localStorage.setItem("alat", JSON.stringify(alat));
  document.getElementById("inputAlat").value="";
  tampil();
}

function hapusBarang(i){
  barang.splice(i,1);
  localStorage.setItem("barang", JSON.stringify(barang));
  tampil();
}

function hapusAlat(i){
  alat.splice(i,1);
  localStorage.setItem("alat", JSON.stringify(alat));
  tampil();
}

tampil();
</script>

</body>
</html>
